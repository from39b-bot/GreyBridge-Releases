name: Publish Android latest

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - android/GreyBridge-Android.apk
      - android/latest.json
      - .github/workflows/release-android.yml
  workflow_dispatch:

concurrency:
  group: greybridge-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish android-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s android/latest.json
          expected="$(sha256sum android/GreyBridge-Android.apk | cut -d ' ' -f1)"
          if gh release view android-latest >/dev/null 2>&1; then
            published="$(gh api repos/$GITHUB_REPOSITORY/releases/tags/android-latest --jq '.assets[] | select(.name == "GreyBridge-Android.apk") | .digest' || true)"
            if [[ "$published" != "sha256:$expected" ]]; then
              gh release upload android-latest android/GreyBridge-Android.apk --clobber
            fi
            gh release edit android-latest --notes-file android/latest.json --title "GreyBridge Android latest"
          else
            gh release create android-latest android/GreyBridge-Android.apk --target "$GITHUB_SHA" --title "GreyBridge Android latest" --notes-file android/latest.json
          fi
